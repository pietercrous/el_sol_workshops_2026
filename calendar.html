<!DOCTYPE html>
<html lang="en" x-data="appData()" :class="{ 'dark': darkMode }">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Sol Festival - 24-Hour Calendar View</title>

  <!-- PWA Meta Tags & Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#D63384">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="elSol Calendar">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              pink: '#D63384',
              orange: '#FD7E14',
              blue: '#0D6EFD',
              darkBg: '#121212',
              darkCard: '#1E1E1E'
            }
          }
        }
      }
    }
  </script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] {
      display: none !important;
    }
  </style>

  <svg style="display: None;">
    <defs>
      <symbol id="icon-ghost" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="icon icon-tabler icons-tabler-outline icon-tabler-ghost">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path
          d="M5 11a7 7 0 0 1 14 0v7a1.78 1.78 0 0 1 -3.1 1.4a1.65 1.65 0 0 0 -2.6 0a1.65 1.65 0 0 1 -2.6 0a1.65 1.65 0 0 0 -2.6 0a1.78 1.78 0 0 1 -3.1 -1.4v-7" />
        <path d="M10 10l.01 0" />
        <path d="M14 10l.01 0" />
        <path d="M10 14a3.5 3.5 0 0 0 4 0" />
      </symbol>
    </defs>
  </svg>
</head>

<body
  class="bg-gray-50 text-gray-800 dark:bg-[#121212] dark:text-gray-200 min-h-screen transition-colors duration-200 font-sans antialiased">

  <!-- Header -->
  <header
    class="sticky top-0 z-30 bg-white/90 dark:bg-[#181818]/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-3 py-2">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      
      <div class="flex items-center gap-2">
        <h1 class="text-base font-bold text-gray-900 dark:text-white flex items-center gap-1.5 shrink-0">
          <span class="text-pink-600">elSol</span> <span class="text-xs font-semibold text-gray-500 dark:text-gray-400">24H Calendar</span>
        </h1>
        <span x-show="!isOnline" x-cloak class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20">
          ⚡ Offline Mode
        </span>
      </div>

      <div class="flex items-center gap-1.5">
        <a href="index.html" title="Switch to Grid View"
          class="p-2 rounded-lg bg-pink-50 text-pink-700 hover:bg-pink-100 dark:bg-pink-950/60 dark:text-pink-300 dark:hover:bg-pink-900/80 transition flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
          </svg>
        </a>

        <button @click="fetchSchedule()" :disabled="loading || !isOnline" :title="isOnline ? 'Sync Schedule' : 'Offline - Sync disabled'"
          :class="!isOnline ? 'opacity-50 cursor-not-allowed bg-gray-400' : 'bg-pink-600 hover:bg-pink-700'"
          class="p-2 rounded-lg text-white transition shadow-2xs flex items-center justify-center">
          <svg x-show="!loading" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.035 8.035 0 01-15.357-2m15.357 2H15" />
          </svg>
          <svg x-show="loading" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
        </button>

        <button @click="darkMode = !darkMode" title="Toggle Dark/Light Mode"
          class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-700 transition flex items-center justify-center">
          <span class="text-sm leading-none" x-text="darkMode ? '☀️' : '🌙'"></span>
        </button>
      </div>

    </div>
  </header>

  <main class="max-w-7xl mx-auto px-2 sm:px-4 py-3 sm:py-4">
    <!-- Filter Bar -->
    <section class="mb-3 sm:mb-4 bg-white dark:bg-[#1E1E1E] rounded-xl border border-gray-200 dark:border-gray-800 shadow-2xs overflow-hidden">
      <div @click="filtersOpen = !filtersOpen"
        class="w-full px-3 py-2.5 bg-gray-50/90 dark:bg-gray-800/60 flex items-center justify-between cursor-pointer select-none hover:bg-gray-100 dark:hover:bg-gray-800 transition">
        <div class="flex items-center gap-2 overflow-hidden">
          <svg class="w-4 h-4 text-pink-600 dark:text-pink-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
          </svg>
          <span class="font-bold text-xs text-gray-900 dark:text-white uppercase tracking-wider shrink-0">Filters</span>
          <span class="text-[10px] px-2 py-0.5 rounded-full bg-pink-100 text-pink-700 dark:bg-pink-950 dark:text-pink-300 font-semibold shrink-0"
            x-text="activeFilterCount > 0 ? activeFilterCount + ' Active' : 'Off'"></span>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <button @click.stop="resetFilters()" x-show="activeFilterCount > 0"
            class="text-[11px] text-pink-600 dark:text-pink-400 hover:underline font-medium">
            Reset All
          </button>
          <span class="text-gray-400 text-xs transition-transform duration-200" :class="filtersOpen ? 'rotate-180' : ''">&#9660;</span>
        </div>
      </div>

      <div x-show="filtersOpen" x-collapse x-cloak class="p-3.5 sm:p-4 space-y-4 border-t border-gray-200 dark:border-gray-800">
        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Festival Day</label>
          <div class="flex flex-wrap items-center gap-1 bg-gray-100 dark:bg-gray-800 p-1 rounded-lg text-xs font-medium">
            <template x-for="date in availableDates" :key="date">
              <button @click="selectedDate = date"
                :class="selectedDate === date ? 'bg-white dark:bg-[#2A2A2A] text-gray-900 dark:text-white shadow-2xs font-bold' : 'text-gray-500 hover:text-gray-900 dark:hover:text-white'"
                class="px-3 py-1.5 rounded-md transition text-center flex-1 sm:flex-none" x-text="formatDateFormatted(date)"></button>
            </template>
            <button @click="selectedDate = 'All'"
              :class="selectedDate === 'All' ? 'bg-white dark:bg-[#2A2A2A] text-gray-900 dark:text-white shadow-2xs font-bold' : 'text-gray-500 hover:text-gray-900 dark:hover:text-white'"
              class="px-3 py-1.5 rounded-md transition text-center flex-1 sm:flex-none">All Days</button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Dance Style</label>
          <div class="flex flex-wrap items-center gap-1.5">
            <button @click="selectedStyle = 'All'"
              :class="selectedStyle === 'All' ? 'bg-gray-900 text-white dark:bg-white dark:text-gray-900 font-bold' : 'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400 hover:bg-gray-200'"
              class="px-3 py-1 text-xs rounded-full transition active:scale-95">All Styles</button>
            <template x-for="style in styles" :key="style">
              <button @click="selectedStyle = style"
                :class="selectedStyle === style ? 'ring-2 ring-pink-500 font-bold scale-105' : 'opacity-85 hover:opacity-100'"
                :style="`background-color: ${getStyleBadgeBg(style)}; color: ${getStyleBadgeText(style)}`"
                class="px-3 py-1 text-xs rounded-full transition active:scale-95" x-text="style"></button>
            </template>
          </div>
        </div>
      </div>
    </section>

    <!-- Scrollable 24-Hour Vertical Grid -->
    <div class="bg-white dark:bg-[#1E1E1E] rounded-xl border border-gray-200 dark:border-gray-800 shadow-2xs overflow-hidden">
      <div class="overflow-x-auto">
        <div class="min-w-[650px] sm:min-w-full">
          
          <div class="flex border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/80 sticky top-0 z-20">
            <div class="w-14 sm:w-20 shrink-0 border-r border-gray-200 dark:border-gray-800 p-2 text-center text-[10px] sm:text-xs font-semibold text-gray-400">
              Time
            </div>
            <div class="flex-1 grid gap-0" :class="gridColClass">
              <template x-for="dateKey in displayedDates" :key="dateKey">
                <div class="p-2 text-center border-r border-gray-200 dark:border-gray-800 last:border-r-0">
                  <span class="block font-bold text-xs sm:text-sm text-gray-900 dark:text-white" x-text="formatDateFormatted(dateKey)"></span>
                  <span class="text-[10px] text-gray-500 dark:text-gray-400 font-medium" x-text="getWorkshopsForDate(dateKey).length + ' events'"></span>
                </div>
              </template>
            </div>
          </div>

          <div class="relative overflow-y-auto max-h-[78vh] touch-pan-y">
            <!-- 24 Hours * 60px = 1440px height -->
            <div class="flex relative min-h-[1440px]">
              
              <div class="w-14 sm:w-20 shrink-0 border-r border-gray-200 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-900/40 select-none">
                <template x-for="hIndex in 24" :key="hIndex">
                  <div class="h-[60px] border-b border-gray-100 dark:border-gray-800/60 pr-1.5 pt-1 text-right text-[10px] sm:text-xs font-bold text-gray-500 dark:text-gray-400">
                    <span x-text="String(hIndex - 1).padStart(2, '0') + ':00'"></span>
                  </div>
                </template>
              </div>

              <div class="flex-1 grid gap-0 relative" :class="gridColClass">
                <template x-for="dateKey in displayedDates" :key="dateKey">
                  <div class="relative border-r border-gray-200 dark:border-gray-800 last:border-r-0 min-h-[1440px]">
                    
                    <template x-for="h in 24" :key="h">
                      <div class="h-[60px] border-b border-gray-100 dark:border-gray-800/40"></div>
                    </template>

                    <template x-for="eObj in getWorkshopsForDateWithLayout(dateKey)" :key="eObj.item.id">
                      <div @click="openModal(eObj.item)"
                        class="absolute rounded-lg p-1.5 sm:p-2 shadow-2xs cursor-pointer overflow-hidden transition-all duration-150 border-l-4 hover:z-30 hover:shadow-md active:scale-98"
                        :style="`
                          top: ${eObj.top}px;
                          height: ${eObj.height}px;
                          left: calc(${eObj.leftPct}% + 1px);
                          width: calc(${eObj.widthPct}% - 2px);
                          border-left-color: ${getInterestHex(getItemUserData(eObj.item.id).interest || '')};
                          background-color: ${getStyleCardBg(eObj.item.Style)};
                          box-shadow: 0 1px 4px rgba(0,0,0,0.08);
                        `">
                        
                        <div class="flex items-center justify-between text-[10px] text-gray-500 dark:text-gray-400 mb-0.5">
                          <span class="uppercase px-1 py-0.5 rounded text-[8px] sm:text-[9px] font-bold tracking-tight truncate max-w-[70px] sm:max-w-[100px]"
                            :class="darkMode ? getLocationMeta(eObj.item.Location).class_text_dark : getLocationMeta(eObj.item.Location).class_text_light"
                            :style="`background-color: ${getLocationMeta(eObj.item.Location).colour_hex || 'transparent'}`"
                            x-text="getLocationMeta(eObj.item.Location).name"></span>
                        </div>

                        <h3 class="font-bold text-[11px] sm:text-xs text-gray-900 dark:text-white leading-tight mb-0.5 line-clamp-2" x-text="eObj.item.Name"></h3>
                        <p class="text-[10px] sm:text-xs text-gray-700 dark:text-gray-300 font-medium truncate mb-0.5" x-text="eObj.item.Facilitator || '—'"></p>

                        <div class="flex items-center justify-between gap-1 text-[9px] sm:text-[10px] mt-0.5" x-show="eObj.height >= 40">
                          <span class="px-1.5 py-0.2 rounded-full font-semibold truncate"
                            :style="`background-color: ${getStyleBadgeBg(eObj.item.Style)}; color: ${getStyleBadgeText(eObj.item.Style)}`"
                            x-text="eObj.item.Style"></span>

                          <template x-if="getItemUserData(eObj.item.id).interest">
                            <span class="px-1.5 py-0.2 rounded-full text-white font-bold shrink-0"
                              :style="`background-color: ${getInterestHex(getItemUserData(eObj.item.id).interest)}`"
                              x-text="getInterestName(getItemUserData(eObj.item.id).interest)"></span>
                          </template>
                        </div>

                      </div>
                    </template>

                  </div>
                </template>
              </div>

            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Interactive Modal (Fixed selection sync) -->
  <div x-show="modalOpen" x-cloak
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs"
    x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
    <div @click.outside="closeModal()"
      class="bg-white dark:bg-[#1E1E1E] rounded-2xl max-w-md w-full p-5 sm:p-6 shadow-xl border border-gray-200 dark:border-gray-800 space-y-4 relative">
      <button @click="closeModal()"
        class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-white text-lg font-bold p-1">&times;</button>

      <template x-if="activeItem">
        <div>
          <div class="flex items-center justify-between gap-2 text-xs text-gray-500 dark:text-gray-400 mb-1">
            <span class="font-semibold" x-text="formatTimeDisplay(activeItem)"></span>
            <span class="uppercase font-medium px-2 py-0.5 rounded text-[10px]"
              :class="darkMode ? getLocationMeta(activeItem.Location).class_text_dark : getLocationMeta(activeItem.Location).class_text_light"
              :style="`background-color: ${getLocationMeta(activeItem.Location).colour_hex || 'transparent'}`"
              x-text="getLocationMeta(activeItem.Location).name"></span>
          </div>
          <h2 class="text-base sm:text-lg font-bold text-gray-900 dark:text-white" x-text="activeItem.Name"></h2>
          <p class="text-xs text-gray-500 dark:text-gray-400 mb-3"
            x-text="'Facilitator: ' + (activeItem.Facilitator || 'N/A')"></p>

          <div class="space-y-3.5 pt-2">
            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Interest Level</label>
              <select :value="getItemUserData(activeItem.id).interest"
                @change="updateUserInterest(activeItem.id, $event.target.value)"
                class="w-full text-xs rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 p-2 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-pink-500">
                <option value="" :selected="!getItemUserData(activeItem.id).interest">None (Unselected)</option>
                <template x-for="level in interestDefinitions" :key="level.id">
                  <option :value="level.id" :selected="String(level.id) === String(getItemUserData(activeItem.id).interest)" x-text="level.name"></option>
                </template>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Experience Rating</label>
              <select :value="getItemUserData(activeItem.id).rating"
                @change="updateUserRating(activeItem.id, $event.target.value)"
                class="w-full text-xs rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 p-2 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-pink-500">
                <option value="" :selected="!getItemUserData(activeItem.id).rating">Unrated</option>
                <template x-for="exp in experienceDefinitions" :key="exp.id">
                  <option :value="exp.id" :selected="String(exp.id) === String(getItemUserData(activeItem.id).rating)" x-text="exp.name"></option>
                </template>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Personal Notes</label>
              <textarea :value="getItemUserData(activeItem.id).notes"
                @input.debounce.300ms="updateUserNotes(activeItem.id, $event.target.value)" rows="3"
                placeholder="Add takeaways, moves learned, or comments..."
                class="w-full text-xs rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 p-2 text-gray-800 dark:text-gray-200 placeholder-gray-400 focus:ring-2 focus:ring-pink-500"></textarea>
            </div>
          </div>

          <div class="pt-3 flex justify-end">
            <button @click="closeModal()"
              class="px-4 py-2 bg-pink-600 hover:bg-pink-700 text-white font-medium text-xs rounded-lg transition shadow-2xs">Save & Done</button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW reg failed:', err));
      });
    }

    function getInitialDarkMode() {
      const saved = localStorage.getItem('darkMode');
      if (saved !== null) {
        return saved === 'true';
      }
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    function appData() {
      return {
        darkMode: getInitialDarkMode(),
        isOnline: navigator.onLine,
        loading: false,
        filtersOpen: false,
        selectedDate: '',
        selectedStyle: 'All',
        selectedFacilitator: 'All',
        selectedInterestLevels: [],
        selectedExperienceRatings: [],
        modalOpen: false,
        activeItem: null,

        styles: ['Salsa', 'Cuban', 'Bachata', 'Special', 'Salsa Romantica'],

        interestDefinitions: [
          { id: '1', name: '1 - Skip', hex: '#6C757D' },
          { id: '2', name: '2 - Low', hex: '#6C757D' },
          { id: '3', name: '3 - Medium', hex: '#17A2B8' },
          { id: '4', name: '4 - High', hex: '#28A745' },
          { id: '5', name: '5 - Must Attend', hex: '#D63384' }
        ],

        experienceDefinitions: [
          { id: '1', name: '1 - Poor', hex: '#DC3545' },
          { id: '2', name: '2 - Fair', hex: '#FD7E14' },
          { id: '3', name: '3 - Good', hex: '#FFC107' },
          { id: '4', name: '4 - Great', hex: '#28A745' },
          { id: '5', name: '5 - Mindblowing', hex: '#0D6EFD' }
        ],

        difficultyDefinitions: {},
        locationDefinitions: {},
        schedule: [],
        userData: {},

        sheetKey: '1L7pRkX-guI1Ka30VcUjIYgE8pu8bhQFm4btvUi2athg',

        getEventPos(item) {
          let startMin = null;
          let endMin = null;

          if (item.start_time) {
            const match = String(item.start_time).match(/(\d{1,2}):(\d{2})/);
            if (match) startMin = parseInt(match[1], 10) * 60 + parseInt(match[2], 10);
          }
          if (item.end_time) {
            const match = String(item.end_time).match(/(\d{1,2}):(\d{2})/);
            if (match) endMin = parseInt(match[1], 10) * 60 + parseInt(match[2], 10);
          }

          if ((startMin === null || endMin === null) && item.Time) {
            const times = String(item.Time).match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
            if (times) {
              if (startMin === null) startMin = parseInt(times[1], 10) * 60 + parseInt(times[2], 10);
              if (endMin === null) endMin = parseInt(times[3], 10) * 60 + parseInt(times[4], 10);
            }
          }

          if (startMin === null) startMin = 0;
          if (endMin === null || endMin <= startMin) endMin = startMin + 60;

          // 24-hour timeline scale: 1 hour = 60px (1 minute = 1px)
          const topPx = startMin;
          const heightPx = Math.max(endMin - startMin, 35);

          return { top: topPx, height: heightPx, startMin, endMin };
        },

        getItemUserData(id) {
          const key = String(id);
          if (!this.userData[key]) {
            this.userData[key] = { interest: '', rating: '', notes: '' };
          }
          return this.userData[key];
        },

        saveUserData() {
          localStorage.setItem('elSol_userData', JSON.stringify(this.userData));
        },

        updateUserInterest(id, val) {
          const key = String(id);
          if (!this.userData[key]) {
            this.userData[key] = { interest: '', rating: '', notes: '' };
          }
          this.userData[key] = {
            ...this.userData[key],
            interest: String(val || '')
          };
          this.userData = { ...this.userData };
          this.saveUserData();
        },

        updateUserRating(id, val) {
          const key = String(id);
          if (!this.userData[key]) {
            this.userData[key] = { interest: '', rating: '', notes: '' };
          }
          this.userData[key] = {
            ...this.userData[key],
            rating: String(val || '')
          };
          this.userData = { ...this.userData };
          this.saveUserData();
        },

        updateUserNotes(id, val) {
          const key = String(id);
          if (!this.userData[key]) {
            this.userData[key] = { interest: '', rating: '', notes: '' };
          }
          this.userData[key] = {
            ...this.userData[key],
            notes: String(val || '')
          };
          this.userData = { ...this.userData };
          this.saveUserData();
        },

        openModal(item) {
          this.activeItem = item;
          this.getItemUserData(item.id);
          this.modalOpen = true;
        },

        closeModal() {
          this.modalOpen = false;
          this.activeItem = null;
        }
      }
    }
  </script>
</body>
</html>
