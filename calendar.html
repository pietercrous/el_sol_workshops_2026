<!DOCTYPE html>
<html lang="en" x-data="appData()" :class="{ 'dark': darkMode }">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Sol Festival - 24-Hour Calendar View</title>

  <!-- PWA Meta Tags & Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#D63384">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="elSol Calendar">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              pink: '#D63384',
              orange: '#FD7E14',
              blue: '#0D6EFD',
              darkBg: '#121212',
              darkCard: '#1E1E1E'
            }
          }
        }
      }
    }
  </script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] {
      display: none !important;
    }
  </style>

  <svg style="display: None;">
    <defs>
      <symbol id="icon-ghost" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="icon icon-tabler icons-tabler-outline icon-tabler-ghost">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path
          d="M5 11a7 7 0 0 1 14 0v7a1.78 1.78 0 0 1 -3.1 1.4a1.65 1.65 0 0 0 -2.6 0a1.65 1.65 0 0 1 -2.6 0a1.65 1.65 0 0 0 -2.6 0a1.78 1.78 0 0 1 -3.1 -1.4v-7" />
        <path d="M10 10l.01 0" />
        <path d="M14 10l.01 0" />
        <path d="M10 14a3.5 3.5 0 0 0 4 0" />
      </symbol>
    </defs>
  </svg>
</head>

<body
  class="bg-gray-50 text-gray-800 dark:bg-[#121212] dark:text-gray-200 min-h-screen transition-colors duration-200 font-sans antialiased">

  <!-- Header -->
  <header
    class="sticky top-0 z-30 bg-white/90 dark:bg-[#181818]/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-3 py-2">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      
      <div class="flex items-center gap-2">
        <h1 class="text-base font-bold text-gray-900 dark:text-white flex items-center gap-1.5 shrink-0">
          <span class="text-pink-600">elSol</span> <span class="text-xs font-semibold text-gray-500 dark:text-gray-400">24H Calendar</span>
        </h1>
        <span x-show="!isOnline" x-cloak class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20">
          ⚡ Offline Mode
        </span>
      </div>

      <div class="flex items-center gap-1.5">
        <a href="index.html" title="Switch to Grid View"
          class="p-2 rounded-lg bg-pink-50 text-pink-700 hover:bg-pink-100 dark:bg-pink-950/60 dark:text-pink-300 dark:hover:bg-pink-900/80 transition flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
          </svg>
        </a>

        <button @click="fetchSchedule()" :disabled="loading || !isOnline" :title="isOnline ? 'Sync Schedule' : 'Offline - Sync disabled'"
          :class="!isOnline ? 'opacity-50 cursor-not-allowed bg-gray-400' : 'bg-pink-600 hover:bg-pink-700'"
          class="p-2 rounded-lg text-white transition shadow-2xs flex items-center justify-center">
          <svg x-show="!loading" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.035 8.035 0 01-15.357-2m15.357 2H15" />
          </svg>
          <svg x-show="loading" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
        </button>

        <button @click="darkMode = !darkMode" title="Toggle Dark/Light Mode"
          class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-700 transition flex items-center justify-center">
          <span class="text-sm leading-none" x-text="darkMode ? '☀️' : '🌙'"></span>
        </button>
      </div>

    </div>
  </header>

  <main class="max-w-7xl mx-auto px-2 sm:px-4 py-3 sm:py-4">
    <!-- Filter Bar -->
    <section class="mb-3 sm:mb-4 bg-white dark:bg-[#1E1E1E] rounded-xl border border-gray-200 dark:border-gray-800 shadow-2xs overflow-hidden">
      <div @click="filtersOpen = !filtersOpen"
        class="w-full px-3 py-2.5 bg-gray-50/90 dark:bg-gray-800/60 flex items-center justify-between cursor-pointer select-none hover:bg-gray-100 dark:hover:bg-gray-800 transition">
        <div class="flex items-center gap-2 overflow-hidden">
          <svg class="w-4 h-4 text-pink-600 dark:text-pink-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
          </svg>
          <span class="font-bold text-xs text-gray-900 dark:text-white uppercase tracking-wider shrink-0">Filters</span>
          <span class="text-[10px] px-2 py-0.5 rounded-full bg-pink-100 text-pink-700 dark:bg-pink-950 dark:text-pink-300 font-semibold shrink-0"
            x-text="activeFilterCount > 0 ? activeFilterCount + ' Active' : 'Off'"></span>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <button @click.stop="resetFilters()" x-show="activeFilterCount > 0"
            class="text-[11px] text-pink-600 dark:text-pink-400 hover:underline font-medium">
            Reset All
          </button>
          <span class="text-gray-400 text-xs transition-transform duration-200" :class="filtersOpen ? 'rotate-180' : ''">&#9660;</span>
        </div>
      </div>

      <div x-show="filtersOpen" x-collapse x-cloak class="p-3.5 sm:p-4 space-y-4 border-t border-gray-200 dark:border-gray-800">
        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Festival Day</label>
          <div class="flex flex-wrap items-center gap-1 bg-gray-100 dark:bg-gray-800 p-1 rounded-lg text-xs font-medium">
            <template x-for="date in availableDates" :key="date">
              <button @click="selectedDate = date"
                :class="selectedDate === date ? 'bg-white dark:bg-[#2A2A2A] text-gray-900 dark:text-white shadow-2xs font-bold' : 'text-gray-500 hover:text-gray-900 dark:hover:text-white'"
                class="px-3 py-1.5 rounded-md transition text-center flex-1 sm:flex-none" x-text="formatDateFormatted(date)"></button>
            </template>
            <button @click="selectedDate = 'All'"
              :class="selectedDate === 'All' ? 'bg-white dark:bg-[#2A2A2A] text-gray-900 dark:text-white shadow-2xs font-bold' : 'text-gray-500 hover:text-gray-900 dark:hover:text-white'"
              class="px-3 py-1.5 rounded-md transition text-center flex-1 sm:flex-none">All Days</button>
          </div>
        </div>

        <!-- Multi-Select Dance Style -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Dance Style (Multi-select)</label>
          <div class="flex flex-wrap items-center gap-1.5">
            <button @click="selectedStyles = []"
              :class="selectedStyles.length === 0 ? 'bg-gray-900 text-white dark:bg-white dark:text-gray-900 font-bold' : 'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400 hover:bg-gray-200'"
              class="px-3 py-1 text-xs rounded-full transition active:scale-95">All Styles</button>
            <template x-for="style in styles" :key="style">
              <button @click="toggleStyleFilter(style)"
                :class="selectedStyles.includes(style) ? 'ring-2 ring-pink-500 font-bold scale-105 shadow-2xs' : 'opacity-75 hover:opacity-100'"
                :style="`background-color: ${getStyleBadgeBg(style)}; color: ${getStyleBadgeText(style)}`"
                class="px-3 py-1 text-xs rounded-full transition active:scale-95 flex items-center gap-1">
                <span x-text="selectedStyles.includes(style) ? '✓' : '+'"></span>
                <span x-text="style"></span>
              </button>
            </template>
            <button @click="selectedStyles = []" x-show="selectedStyles.length > 0"
              class="text-[11px] text-gray-400 hover:text-gray-600 dark:hover:text-white ml-1 font-medium">Clear</button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-1">
          <!-- Searchable Dependent Multi-Select Dropdown for Artists -->
          <div class="relative" @click.outside="artistDropdownOpen = false">
            <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
              Artist / Instructor
              <span x-show="selectedStyles.length > 0" class="text-[10px] text-pink-600 dark:text-pink-400 font-normal">
                (Filtered by selected style)
              </span>
            </label>

            <!-- Custom Select Box Header -->
            <div @click="artistDropdownOpen = !artistDropdownOpen"
              class="w-full px-3 py-2 text-xs rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-gray-800 dark:text-gray-200 cursor-pointer flex items-center justify-between shadow-2xs hover:bg-gray-100 dark:hover:bg-gray-750 transition">
              <span class="truncate font-medium" x-text="artistSelectionText"></span>
              <div class="flex items-center gap-1 shrink-0">
                <button @click.stop="selectedFacilitators = []" x-show="selectedFacilitators.length > 0"
                  class="text-[10px] bg-pink-100 dark:bg-pink-950 text-pink-700 dark:text-pink-300 px-1.5 py-0.5 rounded hover:bg-pink-200 transition font-bold">
                  Clear
                </button>
                <span class="text-gray-400 text-xs transition-transform duration-200" :class="artistDropdownOpen ? 'rotate-180' : ''">&#9660;</span>
              </div>
            </div>

            <!-- Dropdown Menu -->
            <div x-show="artistDropdownOpen" x-cloak x-transition
              class="absolute left-0 right-0 top-full mt-1 z-50 bg-white dark:bg-[#1E1E1E] border border-gray-200 dark:border-gray-800 rounded-xl shadow-xl p-2.5 space-y-2 max-h-64 overflow-hidden flex flex-col">
              
              <!-- Search Input inside dropdown -->
              <div class="relative shrink-0">
                <input type="text" x-model="artistSearchQuery" placeholder="Search instructor..."
                  class="w-full px-2.5 py-1.5 text-xs rounded-lg bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-pink-500">
                <button x-show="artistSearchQuery.length > 0" @click="artistSearchQuery = ''"
                  class="absolute right-2 top-1.5 text-gray-400 hover:text-gray-600 text-xs">&times;</button>
              </div>

              <!-- Action Controls -->
              <div class="flex items-center justify-between text-[10px] text-gray-500 dark:text-gray-400 px-1 border-b border-gray-100 dark:border-gray-800 pb-1.5 shrink-0">
                <button @click="selectedFacilitators = []" class="hover:text-pink-600 dark:hover:text-pink-400 font-medium">Show All Artists</button>
                <button @click="selectAllFilteredArtists()" class="hover:text-pink-600 dark:hover:text-pink-400 font-medium" x-show="filteredFacilitators.length > 0">Select Visible (<span x-text="filteredFacilitators.length"></span>)</button>
              </div>

              <!-- Artist Items List -->
              <div class="overflow-y-auto space-y-1 flex-1 pr-1">
                <template x-for="fac in filteredFacilitators" :key="fac">
                  <label class="flex items-center gap-2 px-2 py-1.5 rounded-lg text-xs hover:bg-gray-100 dark:hover:bg-gray-800 cursor-pointer select-none transition">
                    <input type="checkbox" :value="fac"
                      :checked="selectedFacilitators.includes(fac)"
                      @change="toggleFacilitatorFilter(fac)"
                      class="rounded text-pink-600 focus:ring-pink-500 h-3.5 w-3.5 border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800">
                    <span class="text-gray-800 dark:text-gray-200 truncate" x-text="fac"></span>
                  </label>
                </template>

                <div x-show="filteredFacilitators.length === 0" class="text-center py-4 text-[11px] text-gray-400">
                  No instructors found.
                </div>
              </div>

            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Interest Levels</label>
            <div class="flex flex-wrap items-center gap-1.5">
              <!-- Unknown / Unselected Option -->
              <button @click="toggleInterestFilter('Unselected')"
                :class="selectedInterestLevels.includes('Unselected') ? 'ring-2 ring-offset-1 ring-pink-500 font-bold scale-105' : 'opacity-70 hover:opacity-100'"
                style="background-color: #6C757D; color: #ffffff;"
                class="px-2.5 py-1 rounded-full text-xs transition shadow-2xs flex items-center gap-1 active:scale-95">
                <span x-text="selectedInterestLevels.includes('Unselected') ? '✓' : '+'"></span>
                <span>Unknown</span>
              </button>

              <template x-for="lvl in interestDefinitions" :key="lvl.id">
                <button @click="toggleInterestFilter(lvl.id)"
                  :class="selectedInterestLevels.includes(String(lvl.id)) ? 'ring-2 ring-offset-1 ring-pink-500 font-bold scale-105' : 'opacity-70 hover:opacity-100'"
                  :style="`background-color: ${lvl.hex}; color: #ffffff;`"
                  class="px-2.5 py-1 rounded-full text-xs transition shadow-2xs flex items-center gap-1 active:scale-95">
                  <span x-text="selectedInterestLevels.includes(String(lvl.id)) ? '✓' : '+'"></span>
                  <span x-text="lvl.name"></span>
                </button>
              </template>
              <button @click="selectedInterestLevels = []" x-show="selectedInterestLevels.length > 0"
                class="text-[11px] text-gray-400 hover:text-gray-600 dark:hover:text-white ml-1">Clear</button>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Experience Ratings</label>
            <div class="flex flex-wrap items-center gap-1.5">
              <template x-for="exp in experienceDefinitions" :key="exp.id">
                <button @click="toggleExperienceFilter(exp.id)"
                  :class="selectedExperienceRatings.includes(String(exp.id)) ? 'ring-2 ring-offset-1 ring-pink-500 font-bold scale-105' : 'opacity-70 hover:opacity-100'"
                  :style="`background-color: ${exp.hex}; color: #ffffff;`"
                  class="px-2.5 py-1 rounded-full text-xs transition shadow-2xs flex items-center gap-1 active:scale-95">
                  <span x-text="selectedExperienceRatings.includes(String(exp.id)) ? '✓' : '+'"></span>
                  <span x-text="exp.name"></span>
                </button>
              </template>
              <button @click="selectedExperienceRatings = []" x-show="selectedExperienceRatings.length > 0"
                class="text-[11px] text-gray-400 hover:text-gray-600 dark:hover:text-white ml-1">Clear</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 24-Hour Vertical Grid with Horizontal Scroll -->
    <div class="bg-white dark:bg-[#1E1E1E] rounded-xl border border-gray-200 dark:border-gray-800 shadow-2xs overflow-hidden">
      <div class="overflow-x-auto w-full touch-pan-x">
        <div :style="gridMinWidthStyle">
          
          <!-- Sticky Header for Dates -->
          <div class="flex border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/80 sticky top-0 z-20">
            <div class="w-14 sm:w-20 shrink-0 border-r border-gray-200 dark:border-gray-800 p-2 text-center text-[10px] sm:text-xs font-semibold text-gray-400">
              Time
            </div>
            <div class="flex-1 grid gap-0" :class="gridColClass">
              <template x-for="dateKey in displayedDates" :key="dateKey">
                <div class="p-2 text-center border-r border-gray-200 dark:border-gray-800 last:border-r-0">
                  <span class="block font-bold text-xs sm:text-sm text-gray-900 dark:text-white" x-text="formatDateFormatted(dateKey)"></span>
                  <span class="text-[10px] text-gray-500 dark:text-gray-400 font-medium" x-text="getWorkshopsForDate(dateKey).length + ' events'"></span>
                </div>
              </template>
            </div>
          </div>

          <!-- Vertical Timeline Body -->
          <div class="relative overflow-y-auto max-h-[78vh] touch-pan-y">
            <div class="flex relative min-h-[1440px]">
              
              <!-- Time Column -->
              <div class="w-14 sm:w-20 shrink-0 border-r border-gray-200 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-900/40 select-none">
                <template x-for="hIndex in 24" :key="hIndex">
                  <div class="h-[60px] border-b border-gray-100 dark:border-gray-800/60 pr-1.5 pt-1 text-right text-[10px] sm:text-xs font-bold text-gray-500 dark:text-gray-400">
                    <span x-text="String(hIndex - 1).padStart(2, '0') + ':00'"></span>
                  </div>
                </template>
              </div>

              <!-- Day Columns -->
              <div class="flex-1 grid gap-0 relative" :class="gridColClass">
                <template x-for="dateKey in displayedDates" :key="dateKey">
                  <div class="relative border-r border-gray-200 dark:border-gray-800 last:border-r-0 min-h-[1440px]">
                    
                    <template x-for="h in 24" :key="h">
                      <div class="h-[60px] border-b border-gray-100 dark:border-gray-800/40"></div>
                    </template>

                    <template x-for="eObj in getWorkshopsForDateWithLayout(dateKey)" :key="eObj.item.id">
                      <div @click="openModal(eObj.item)"
                        class="absolute rounded-lg p-1.5 sm:p-2 shadow-2xs cursor-pointer overflow-hidden transition-all duration-150 border-l-4 hover:z-30 hover:shadow-md active:scale-98"
                        :style="`
                          top: ${eObj.top}px;
                          height: ${eObj.height}px;
                          left: calc(${eObj.leftPct}% + 1px);
                          width: calc(${eObj.widthPct}% - 2px);
                          border-left-color: ${getInterestHex(getItemUserData(eObj.item.id).interest || '')};
                          background-color: ${getStyleCardBg(eObj.item.Style)};
                          box-shadow: 0 1px 4px rgba(0,0,0,0.08);
                        `">
                        
                        <div class="flex items-center justify-between text-[10px] text-gray-500 dark:text-gray-400 mb-0.5">
                          <span class="uppercase px-1 py-0.5 rounded text-[8px] sm:text-[9px] font-bold tracking-tight truncate max-w-[70px] sm:max-w-[100px]"
                            :class="darkMode ? getLocationMeta(eObj.item.Location).class_text_dark : getLocationMeta(eObj.item.Location).class_text_light"
                            :style="`background-color: ${getLocationMeta(eObj.item.Location).colour_hex || 'transparent'}`"
                            x-text="getLocationMeta(eObj.item.Location).name"></span>
                        </div>

                        <h3 class="font-bold text-[11px] sm:text-xs text-gray-900 dark:text-white leading-tight mb-0.5 line-clamp-2" x-text="eObj.item.Name"></h3>
                        <p class="text-[10px] sm:text-xs text-gray-700 dark:text-gray-300 font-medium truncate mb-0.5" x-text="eObj.item.Facilitator || '—'"></p>

                        <div class="flex items-center justify-between gap-1 text-[9px] sm:text-[10px] mt-0.5" x-show="eObj.height >= 40">
                          <span class="px-1.5 py-0.2 rounded-full font-semibold truncate"
                            :style="`background-color: ${getStyleBadgeBg(eObj.item.Style)}; color: ${getStyleBadgeText(eObj.item.Style)}`"
                            x-text="eObj.item.Style"></span>

                          <template x-if="getItemUserData(eObj.item.id).interest">
                            <span class="px-1.5 py-0.2 rounded-full text-white font-bold shrink-0"
                              :style="`background-color: ${getInterestHex(getItemUserData(eObj.item.id).interest)}`"
                              x-text="getInterestName(getItemUserData(eObj.item.id).interest)"></span>
                          </template>
                        </div>

                      </div>
                    </template>

                  </div>
                </template>
              </div>

            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Interactive Modal -->
  <div x-show="modalOpen" x-cloak
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs"
    x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
    <div @click.outside="closeModal()"
      class="bg-white dark:bg-[#1E1E1E] rounded-2xl max-w-md w-full p-5 sm:p-6 shadow-xl border border-gray-200 dark:border-gray-800 space-y-4 relative">
      <button @click="closeModal()"
        class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-white text-lg font-bold p-1">&times;</button>

      <template x-if="activeItem">
        <div>
          <div class="flex items-center justify-between gap-2 text-xs text-gray-500 dark:text-gray-400 mb-1">
            <span class="font-semibold" x-text="formatTimeDisplay(activeItem)"></span>
            <span class="uppercase font-medium px-2 py-0.5 rounded text-[10px]"
              :class="darkMode ? getLocationMeta(activeItem.Location).class_text_dark : getLocationMeta(activeItem.Location).class_text_light"
              :style="`background-color: ${getLocationMeta(activeItem.Location).colour_hex || 'transparent'}`"
              x-text="getLocationMeta(activeItem.Location).name"></span>
          </div>
          
          <div class="flex items-start justify-between gap-2 mb-1">
            <h2 class="text-base sm:text-lg font-bold text-gray-900 dark:text-white" x-text="activeItem.Name"></h2>
            
            <!-- Experience Level Badge (from index view logic) -->
            <div
              class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] justify-center font-medium shrink-0"
              :style="`background-color: ${getDifficultyMeta(activeItem.Difficulty).color};
                color: oklch(from ${getDifficultyMeta(activeItem.Difficulty).color} calc(l - 0.35) c h);`">
              <div class="flex items-center gap-0.5 py-0.5">
                <template x-for="n in Number(getDifficultyMeta(activeItem.Difficulty).multiplier)" :key="n">
                  <svg class="icon" width="14" height="14">
                    <use href="#icon-ghost"></use>
                  </svg>
                </template>
              </div>
            </div>
          </div>

          <p class="text-xs text-gray-500 dark:text-gray-400 mb-3"
            x-text="'Facilitator: ' + (activeItem.Facilitator || 'N/A')"></p>

          <div class="space-y-3.5 pt-2">
            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Interest Level</label>
              <select :value="getItemUserData(activeItem.id).interest"
                @change="updateUserInterest(activeItem.id, $event.target.value)"
                class="w-full text-xs rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 p-2 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-pink-500">
                <option value="" :selected="!getItemUserData(activeItem.id).interest">None (Unselected)</option>
                <template x-for="level in interestDefinitions" :key="level.id">
                  <option :value="level.id" :selected="String(level.id) === String(getItemUserData(activeItem.id).interest)" x-text="level.name"></option>
                </template>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Experience Rating</label>
              <select :value="getItemUserData(activeItem.id).rating"
                @change="updateUserRating(activeItem.id, $event.target.value)"
                class="w-full text-xs rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 p-2 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-pink-500">
                <option value="" :selected="!getItemUserData(activeItem.id).rating">Unrated</option>
                <template x-for="exp in experienceDefinitions" :key="exp.id">
                  <option :value="exp.id" :selected="String(exp.id) === String(getItemUserData(activeItem.id).rating)" x-text="exp.name"></option>
                </template>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Personal Notes</label>
              <textarea :value="getItemUserData(activeItem.id).notes"
                @input.debounce.300ms="updateUserNotes(activeItem.id, $event.target.value)" rows="3"
                placeholder="Add takeaways, moves learned, or comments..."
                class="w-full text-xs rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 p-2 text-gray-800 dark:text-gray-200 placeholder-gray-400 focus:ring-2 focus:ring-pink-500"></textarea>
            </div>
          </div>

          <div class="pt-3 flex justify-end">
            <button @click="closeModal()"
              class="px-4 py-2 bg-pink-600 hover:bg-pink-700 text-white font-medium text-xs rounded-lg transition shadow-2xs">Save & Done</button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW reg failed:', err));
      });
    }

    function getInitialDarkMode() {
      const saved = localStorage.getItem('darkMode');
      if (saved !== null) {
        return saved === 'true';
      }
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    function appData() {
      return {
        darkMode: getInitialDarkMode(),
        isOnline: navigator.onLine,
        loading: false,
        filtersOpen: false,
        selectedDate: '',
        selectedStyles: [],
        selectedFacilitators: [],
        artistSearchQuery: '',
        artistDropdownOpen: false,
        selectedInterestLevels: [],
        selectedExperienceRatings: [],
        modalOpen: false,
        activeItem: null,

        styles: ['Salsa', 'Cuban', 'Bachata', 'Special', 'Salsa Romantica'],

        interestDefinitions: [
  { id: '1', name: '1 - Skip', hex: '#6C757D' },
  { id: '2', name: '2 - Low', hex: '#0D6EFD' },
  { id: '3', name: '3 - Medium', hex: '#17A2B8' },
  { id: '4', name: '4 - High', hex: '#FD7E14' },
  { id: '5', name: '5 - Must Attend', hex: '#D63384' }
],

        experienceDefinitions: [
          { id: '1', name: '1 - Poor', hex: '#DC3545' },
          { id: '2', name: '2 - Fair', hex: '#FD7E14' },
          { id: '3', name: '3 - Good', hex: '#FFC107' },
          { id: '4', name: '4 - Great', hex: '#28A745' },
          { id: '5', name: '5 - Mindblowing', hex: '#0D6EFD' }
        ],

        difficultyDefinitions: {},
        locationDefinitions: {},
        schedule: [],
        userData: {},

        sheetKey: '1L7pRkX-guI1Ka30VcUjIYgE8pu8bhQFm4btvUi2athg',

        get activeFilterCount() {
          let count = 0;
          if (this.selectedStyles.length > 0) count += this.selectedStyles.length;
          if (this.selectedFacilitators.length > 0) count += this.selectedFacilitators.length;
          if (this.selectedInterestLevels.length > 0) count += this.selectedInterestLevels.length;
          if (this.selectedExperienceRatings.length > 0) count += this.selectedExperienceRatings.length;
          return count;
        },

        normalizeDate(dateVal) {
          if (!dateVal) return '';
          const s = String(dateVal).trim();
          if (s.includes('.')) {
            const parts = s.split('.');
            const day = parts[0].padStart(2, '0');
            const month = parts[1].padStart(2, '0');
            const year = parts[2] ? (parts[2].length === 2 ? '20' + parts[2] : parts[2]) : '2026';
            return `${year}-${month}-${day}`;
          }
          if (s.includes('/')) {
            const parts = s.split('/');
            const day = parts[0].padStart(2, '0');
            const month = parts[1].padStart(2, '0');
            const year = parts[2] || '2026';
            return `${year}-${month}-${day}`;
          }
          return s;
        },

        get availableDates() {
          const dates = new Set();
          this.schedule.forEach(item => {
            const rawDate = item.workshop_date || item.Date;
            if (rawDate) {
              dates.add(this.normalizeDate(rawDate));
            }
          });
          return Array.from(dates).sort();
        },

        get displayedDates() {
          if (this.selectedDate !== 'All' && this.selectedDate) return [this.selectedDate];
          return this.availableDates;
        },

        get gridColClass() {
          const count = this.displayedDates.length;
          if (count === 1) return 'grid-cols-1';
          if (count === 2) return 'grid-cols-2';
          if (count === 3) return 'grid-cols-3';
          return 'grid-cols-4';
        },

        get gridMinWidthStyle() {
          const count = this.displayedDates.length;
          if (count === 1) return 'min-width: 100%;';
          if (count === 2) return 'min-width: 750px;';
          if (count === 3) return 'min-width: 1000px;';
          return 'min-width: 1250px;';
        },

        setDefaultDate() {
          if (!this.availableDates || this.availableDates.length === 0) {
            this.selectedDate = 'All';
            return;
          }

          const now = new Date();
          const yyyy = now.getFullYear();
          const mm = String(now.getMonth() + 1).padStart(2, '0');
          const dd = String(now.getDate()).padStart(2, '0');
          const isoToday = `${yyyy}-${mm}-${dd}`;

          const todayMatch = this.availableDates.find(d => d === isoToday);

          if (todayMatch) {
            this.selectedDate = todayMatch;
          } else {
            this.selectedDate = this.availableDates[0];
          }
        },

        toggleStyleFilter(style) {
          if (this.selectedStyles.includes(style)) {
            this.selectedStyles = this.selectedStyles.filter(s => s !== style);
          } else {
            this.selectedStyles.push(style);
          }
          const currentAvailable = this.dependentFacilitators;
          this.selectedFacilitators = this.selectedFacilitators.filter(f => currentAvailable.includes(f));
        },

        get dependentFacilitators() {
          const names = new Set();
          this.schedule.forEach(s => {
            const fac = s.Facilitator ? s.Facilitator.trim() : '';
            if (fac !== '') {
              if (this.selectedStyles.length === 0 || this.selectedStyles.includes(s.Style)) {
                names.add(fac);
              }
            }
          });
          return Array.from(names).sort((a, b) => a.localeCompare(b));
        },

        get filteredFacilitators() {
          const query = this.artistSearchQuery.toLowerCase().trim();
          if (!query) return this.dependentFacilitators;
          return this.dependentFacilitators.filter(f => f.toLowerCase().includes(query));
        },

        get artistSelectionText() {
          if (this.selectedFacilitators.length === 0) {
            return `All Artists (${this.dependentFacilitators.length})`;
          }
          if (this.selectedFacilitators.length === 1) {
            return this.selectedFacilitators[0];
          }
          return `${this.selectedFacilitators.length} Artists Selected`;
        },

        toggleFacilitatorFilter(fac) {
          if (this.selectedFacilitators.includes(fac)) {
            this.selectedFacilitators = this.selectedFacilitators.filter(f => f !== fac);
          } else {
            this.selectedFacilitators.push(fac);
          }
        },

        selectAllFilteredArtists() {
          const newSet = new Set([...this.selectedFacilitators, ...this.filteredFacilitators]);
          this.selectedFacilitators = Array.from(newSet);
        },

        getWorkshopsForDate(dateKey) {
          const targetNormalized = this.normalizeDate(dateKey);

          return this.schedule.filter(item => {
            const itemDateNormalized = this.normalizeDate(item.workshop_date || item.Date);
            const matchDate = (targetNormalized === 'All' || itemDateNormalized === targetNormalized);
            if (!matchDate) return false;

            if (this.selectedStyles.length > 0 && !this.selectedStyles.includes(item.Style)) {
              return false;
            }

            if (this.selectedFacilitators.length > 0 && (!item.Facilitator || !this.selectedFacilitators.includes(item.Facilitator.trim()))) {
              return false;
            }

            const uData = this.getItemUserData(item.id);

            if (this.selectedInterestLevels.length > 0) {
              const interestVal = uData.interest ? String(uData.interest) : '';
              const matchesSelected = this.selectedInterestLevels.some(lvl => {
                if (lvl === 'Unselected') return !interestVal;
                return interestVal === lvl;
              });
              if (!matchesSelected) return false;
            }

            if (this.selectedExperienceRatings.length > 0) {
              if (!uData.rating || !this.selectedExperienceRatings.includes(String(uData.rating))) {
                return false;
              }
            }

            return true;
          });
        },

        formatDateFormatted(dateVal) {
          if (!dateVal) return '';
          const norm = this.normalizeDate(dateVal);
          const parts = norm.split('-');
          if (parts.length === 3) {
            const dayStr = parts[2];
            const mNum = parseInt(parts[1], 10);
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const monthStr = monthNames[mNum - 1] || 'Nov';
            return `${dayStr} ${monthStr}`;
          }
          return dateVal;
        },

        getEventPos(item) {
          let startMin = null;
          let endMin = null;

          if (item.start_time) {
            const match = String(item.start_time).match(/(\d{1,2}):(\d{2})/);
            if (match) startMin = parseInt(match[1], 10) * 60 + parseInt(match[2], 10);
          }
          if (item.end_time) {
            const match = String(item.end_time).match(/(\d{1,2}):(\d{2})/);
            if (match) endMin = parseInt(match[1], 10) * 60 + parseInt(match[2], 10);
          }

          if ((startMin === null || endMin === null) && item.Time) {
            const times = String(item.Time).match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
            if (times) {
              if (startMin === null) startMin = parseInt(times[1], 10) * 60 + parseInt(times[2], 10);
              if (endMin === null) endMin = parseInt(times[3], 10) * 60 + parseInt(times[4], 10);
            }
          }

          if (startMin === null) startMin = 0;
          if (endMin === null || endMin <= startMin) endMin = startMin + 60;

          const topPx = startMin;
          const heightPx = Math.max(endMin - startMin, 35);

          return { top: topPx, height: heightPx, startMin, endMin };
        },

        getWorkshopsForDateWithLayout(dateKey) {
          const items = this.getWorkshopsForDate(dateKey);
          
          const itemsWithBounds = items.map(item => {
            const pos = this.getEventPos(item);
            return {
              item,
              start: pos.startMin,
              end: pos.endMin,
              top: pos.top,
              height: pos.height
            };
          });

          itemsWithBounds.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));

          const positionedItems = [];
          let currentGroup = [];
          let groupMaxEnd = 0;

          itemsWithBounds.forEach(e => {
            if (currentGroup.length === 0) {
              currentGroup = [e];
              groupMaxEnd = e.end;
            } else if (e.start < groupMaxEnd) {
              currentGroup.push(e);
              if (e.end > groupMaxEnd) groupMaxEnd = e.end;
            } else {
              this.assignColumnsToGroup(currentGroup);
              positionedItems.push(...currentGroup);
              currentGroup = [e];
              groupMaxEnd = e.end;
            }
          });

          if (currentGroup.length > 0) {
            this.assignColumnsToGroup(currentGroup);
            positionedItems.push(...currentGroup);
          }

          return positionedItems;
        },

        assignColumnsToGroup(group) {
          const cols = [];
          group.forEach(e => {
            let placed = false;
            for (let i = 0; i < cols.length; i++) {
              if (cols[i] <= e.start) {
                cols[i] = e.end;
                e.colIndex = i;
                placed = true;
                break;
              }
            }
            if (!placed) {
              e.colIndex = cols.length;
              cols.push(e.end);
            }
          });

          const numCols = cols.length;
          group.forEach(e => {
            e.totalCols = numCols;
            e.leftPct = (e.colIndex / numCols) * 100;
            e.widthPct = (1 / numCols) * 100;
          });
        },

        loadUserDataFromStorage() {
          try {
            const raw = localStorage.getItem('elSol_userData');
            this.userData = raw ? JSON.parse(raw) : {};
          } catch (e) {
            this.userData = {};
          }
        },

        getItemUserData(id) {
          const key = String(id);
          if (!this.userData[key]) {
            this.userData[key] = { interest: '', rating: '', notes: '' };
          }
          return this.userData[key];
        },

        saveUserData() {
          localStorage.setItem('elSol_userData', JSON.stringify(this.userData));
        },

        updateUserInterest(id, val) {
          const key = String(id);
          if (!this.userData[key]) {
            this.userData[key] = { interest: '', rating: '', notes: '' };
          }
          this.userData[key] = {
            ...this.userData[key],
            interest: String(val || '')
          };
          this.userData = { ...this.userData };
          this.saveUserData();
        },

        updateUserRating(id, val) {
          const key = String(id);
          if (!this.userData[key]) {
            this.userData[key] = { interest: '', rating: '', notes: '' };
          }
          this.userData[key] = {
            ...this.userData[key],
            rating: String(val || '')
          };
          this.userData = { ...this.userData };
          this.saveUserData();
        },

        updateUserNotes(id, val) {
          const key = String(id);
          if (!this.userData[key]) {
            this.userData[key] = { interest: '', rating: '', notes: '' };
          }
          this.userData[key] = {
            ...this.userData[key],
            notes: String(val || '')
          };
          this.userData = { ...this.userData };
          this.saveUserData();
        },

        toggleInterestFilter(lvlId) {
          const key = String(lvlId);
          if (this.selectedInterestLevels.includes(key)) {
            this.selectedInterestLevels = this.selectedInterestLevels.filter(k => k !== key);
          } else {
            this.selectedInterestLevels.push(key);
          }
        },

        toggleExperienceFilter(expId) {
          const key = String(expId);
          if (this.selectedExperienceRatings.includes(key)) {
            this.selectedExperienceRatings = this.selectedExperienceRatings.filter(k => k !== key);
          } else {
            this.selectedExperienceRatings.push(key);
          }
        },

        resetFilters() {
          this.setDefaultDate();
          this.selectedStyles = [];
          this.selectedFacilitators = [];
          this.artistSearchQuery = '';
          this.selectedInterestLevels = [];
          this.selectedExperienceRatings = [];
        },

        async init() {
          window.addEventListener('online', () => this.isOnline = true);
          window.addEventListener('offline', () => this.isOnline = false);

          this.$watch('darkMode', val => {
            localStorage.setItem('darkMode', val);
          });

          this.loadUserDataFromStorage();

          const storedSched = localStorage.getItem('elSol_schedule');
          const storedDiff = localStorage.getItem('elSol_def_difficulty');
          const storedLoc = localStorage.getItem('elSol_def_location');
          const storedInterest = localStorage.getItem('elSol_def_interest_level');
          const storedExp = localStorage.getItem('elSol_def_experience_level');

          if (storedInterest) this.interestDefinitions = JSON.parse(storedInterest);
          if (storedExp) this.experienceDefinitions = JSON.parse(storedExp);
          if (storedDiff) this.difficultyDefinitions = JSON.parse(storedDiff);
          if (storedLoc) this.locationDefinitions = JSON.parse(storedLoc);

          if (storedSched) {
            this.schedule = JSON.parse(storedSched);
            this.setDefaultDate();
          }

          if (this.isOnline) {
            await this.fetchSchedule();
          }
        },

        fetchSchedule() {
          if (!this.isOnline) return Promise.resolve();
          this.loading = true;
          return Promise.all([
            this.fetchSheetData('def_difficulty'),
            this.fetchSheetData('def_location'),
            this.fetchSheetData('def_interest_level'),
            this.fetchSheetData('def_experience_level'),
            this.fetchSheetData('schedule')
          ]).then(([diffRows, locRows, interestRows, expRows, schedRows]) => {

            if (diffRows && diffRows.length > 0) {
              const diffMap = {};
              diffRows.forEach(r => {
                const id = String(r.Difficulty || r.id || r.name || r.display_name || '').trim();
                if (id) {
                  diffMap[id] = {
                    id: id,
                    name: String(r.display_name || r.name || id).trim(),
                    multiplier: parseInt(r.multiplier || r.multiplier_value || 0, 10) || 0,
                    color: String(r.colour_hex || r.color || r.hex || '#6C757D').trim()
                  };
                }
              });
              this.difficultyDefinitions = diffMap;
              localStorage.setItem('elSol_def_difficulty', JSON.stringify(diffMap));
            }

            if (locRows && locRows.length > 0) {
              const locMap = {};
              locRows.forEach(r => {
                const id = String(r.Location || r.location || r.id || r.name || r.display_name || r.A || '').trim();
                if (id) {
                  locMap[id] = {
                    id: id,
                    name: String(r.Location || r.display_name || r.name || r.A || r.id).trim(),
                    colour_hex: String(r.colour_hex || r.color || r.hex || '').trim(),
                    class_text_light: String(r.class_text_light || r.C || 'text-gray-700').trim(),
                    class_text_dark: String(r.class_text_dark || r.D || 'text-gray-300').trim()
                  };
                }
              });
              this.locationDefinitions = locMap;
              localStorage.setItem('elSol_def_location', JSON.stringify(locMap));
            }

            if (interestRows && interestRows.length > 0) {
              const interestList = interestRows.map(r => {
                const id = String(r.interest_level_id || r.id || r.level_id || r.A || '').trim();
                const name = String(r.name || r.display_name || r.B || id).trim();
                const hex = String(r.hex_color || r.colour_hex || r.hex || r.color || r.C || '#6C757D').trim();
                return { id, name, hex };
              }).filter(item => item.id);

              if (interestList.length > 0) {
                this.interestDefinitions = interestList;
                localStorage.setItem('elSol_def_interest_level', JSON.stringify(interestList));
              }
            }

            if (expRows && expRows.length > 0) {
              const expList = expRows.map(r => {
                const id = String(r.experience_level_id || r.id || r.level_id || r.A || '').trim();
                const name = String(r.name || r.display_name || r.B || id).trim();
                const hex = String(r.hex_color || r.colour_hex || r.hex || r.color || r.C || '#6C757D').trim();
                return { id, name, hex };
              }).filter(item => item.id);

              if (expList.length > 0) {
                this.experienceDefinitions = expList;
                localStorage.setItem('elSol_def_experience_level', JSON.stringify(expList));
              }
            }

            if (schedRows && schedRows.length > 0) {
              this.schedule = schedRows.map((row, idx) => ({
                id: String(row.id || (idx + 1)),
                Date: String(row.Date || '').trim(),
                Time: String(row.Time || '').trim(),
                Style: String(row.Style || 'Salsa').trim(),
                Name: String(row.Name || row['page title'] || 'Workshop').trim(),
                Facilitator: String(row.Facilitator || '').trim(),
                Difficulty: String(row.Difficulty || 'Public').trim(),
                Location: String(row.Location || 'FOYER').trim(),
                workshop_date: String(row.workshop_date || '').trim(),
                start_time: String(row.start_time || '').trim(),
                end_time: String(row.end_time || '').trim()
              }));

              localStorage.setItem('elSol_schedule', JSON.stringify(this.schedule));
              this.setDefaultDate();
            }
          }).catch(err => {
            console.error('Error fetching sheet data:', err);
          }).finally(() => {
            this.loading = false;
          });
        },

        fetchSheetData(sheetName) {
          return new Promise((resolve) => {
            const callbackName = `gviz_cb_${sheetName}_${Date.now()}`;
            window[callbackName] = (response) => {
              try {
                if (response && response.table && response.table.rows) {
                  const cols = response.table.cols.map(c => c.label || c.id);
                  const extractVal = (cell) => {
                    if (!cell) return '';
                    if (cell.f !== undefined && cell.f !== null) return String(cell.f).trim();
                    if (cell.v !== undefined && cell.v !== null) {
                      if (Array.isArray(cell.v)) {
                        const h = String(cell.v[0] || 0).padStart(2, '0');
                        const m = String(cell.v[1] || 0).padStart(2, '0');
                        const s = String(cell.v[2] || 0).padStart(2, '0');
                        return `${h}:${m}:${s}`;
                      }
                      return String(cell.v).trim();
                    }
                    return '';
                  };
                  const parsedRows = response.table.rows.map(r => {
                    const rowObj = {};
                    r.c.forEach((cell, i) => {
                      const colName = cols[i] || `col_${i}`;
                      rowObj[colName] = extractVal(cell);
                    });
                    return rowObj;
                  });
                  resolve(parsedRows);
                } else {
                  resolve([]);
                }
              } catch (e) {
                resolve([]);
              } finally {
                delete window[callbackName];
                const scriptElem = document.getElementById(`script_${sheetName}`);
                if (scriptElem) scriptElem.remove();
              }
            };

            const url = `https://docs.google.com/spreadsheets/d/${this.sheetKey}/gviz/tq?tqx=responseHandler:${callbackName}&sheet=${sheetName}`;
            const script = document.createElement('script');
            script.id = `script_${sheetName}`;
            script.src = url;
            script.onerror = () => resolve([]);
            document.body.appendChild(script);
          });
        },

        formatTimeDisplay(item) {
          if (item.start_time && item.end_time) {
            const start = item.start_time.substring(0, 5);
            const end = item.end_time.substring(0, 5);
            return `${start} - ${end}`;
          }
          return item.Time || '';
        },

        getDifficultyMeta(diffRaw) {
          if (!diffRaw) return { name: 'Public', multiplier: 0, color: '#edf1f5' };
          const rawKey = String(diffRaw).trim();
          if (this.difficultyDefinitions[rawKey]) return this.difficultyDefinitions[rawKey];
          return { name: rawKey, multiplier: 0, color: '#edf1f5' };
        },

        getLocationMeta(locRaw) {
          if (!locRaw) return { name: 'FOYER', colour_hex: '', class_text_light: 'text-gray-700 bg-gray-100', class_text_dark: 'text-gray-300 bg-gray-800' };
          const rawKey = String(locRaw).trim();
          if (this.locationDefinitions[rawKey]) return this.locationDefinitions[rawKey];
          return { name: rawKey, colour_hex: '', class_text_light: 'text-gray-700 bg-gray-100', class_text_dark: 'text-gray-300 bg-gray-800' };
        },

        openModal(item) {
          this.activeItem = item;
          this.getItemUserData(item.id);
          this.modalOpen = true;
        },

        closeModal() {
          this.modalOpen = false;
          this.activeItem = null;
        },

        getInterestHex(interestId) {
          const match = this.interestDefinitions.find(i => String(i.id) === String(interestId));
          return match ? match.hex : '#6C757D';
        },

        getInterestName(interestId) {
          const match = this.interestDefinitions.find(i => String(i.id) === String(interestId));
          return match ? match.name : 'Selected';
        },

        getStyleBadgeBg(style) {
          switch (style) {
            case 'Bachata': return '#FCE7F3';
            case 'Salsa': return '#FFEDD5';
            case 'Cuban': return '#DBEAFE';
            case 'Salsa Romantica': return '#F3E8FF';
            default: return '#F3F4F6';
          }
        },

        getStyleBadgeText(style) {
          switch (style) {
            case 'Bachata': return '#9D174D';
            case 'Salsa': return '#C2410C';
            case 'Cuban': return '#1E40AF';
            case 'Salsa Romantica': return '#6B21A8';
            default: return '#374151';
          }
        },

        getStyleCardBg(style) {
          const isDark = this.darkMode;
          switch (style) {
            case 'Bachata': return isDark ? 'rgba(157, 23, 77, 0.25)' : 'rgba(252, 231, 243, 0.65)';
            case 'Salsa': return isDark ? 'rgba(194, 65, 12, 0.25)' : 'rgba(255, 237, 213, 0.65)';
            case 'Cuban': return isDark ? 'rgba(30, 64, 175, 0.25)' : 'rgba(219, 234, 254, 0.65)';
            case 'Salsa Romantica': return isDark ? 'rgba(107, 33, 168, 0.25)' : 'rgba(243, 232, 255, 0.65)';
            default: return isDark ? 'rgba(38, 38, 38, 0.9)' : 'rgba(243, 244, 246, 0.75)';
          }
        }
      }
    }
  </script>
</body>
</html>
