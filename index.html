<!DOCTYPE html>
<html lang="en" x-data="appData()" :class="{ 'dark': darkMode }">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Sol Festival Schedule</title>

  <!-- PWA Meta Tags & Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#D63384">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="elSol Schedule">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              pink: '#D63384',
              orange: '#FD7E14',
              blue: '#0D6EFD',
              darkBg: '#121212',
              darkCard: '#1E1E1E'
            }
          }
        }
      }
    }
  </script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] {
      display: none !important;
    }
  </style>

  <svg style="display: None;">
    <defs>
      <symbol id="icon-ghost" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="icon icon-tabler icons-tabler-outline icon-tabler-ghost">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path
          d="M5 11a7 7 0 0 1 14 0v7a1.78 1.78 0 0 1 -3.1 1.4a1.65 1.65 0 0 0 -2.6 0a1.65 1.65 0 0 1 -2.6 0a1.65 1.65 0 0 0 -2.6 0a1.78 1.78 0 0 1 -3.1 -1.4v-7" />
        <path d="M10 10l.01 0" />
        <path d="M14 10l.01 0" />
        <path d="M10 14a3.5 3.5 0 0 0 4 0" />
      </symbol>
    </defs>
  </svg>
</head>

<body
  class="bg-gray-50 text-gray-800 dark:bg-[#121212] dark:text-gray-200 min-h-screen transition-colors duration-200 font-sans antialiased">

  <!-- Minimal Header -->
  <header
    class="sticky top-0 z-30 bg-white/90 dark:bg-[#181818]/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-3 py-2">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      
      <!-- Brand Title + Offline Indicator -->
      <div class="flex items-center gap-2">
        <h1 class="text-base font-bold text-gray-900 dark:text-white flex items-center gap-1.5 shrink-0">
          <span class="text-pink-600">elSol</span> <span class="text-xs font-semibold text-gray-500 dark:text-gray-400">Grid View</span>
        </h1>
        <span x-show="!isOnline" x-cloak class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20">
          ⚡ Offline Mode
        </span>
      </div>

      <div class="flex items-center gap-1.5">
        <a href="calendar.html" title="Switch to 24-Hour Calendar View"
          class="p-2 rounded-lg bg-pink-50 text-pink-700 hover:bg-pink-100 dark:bg-pink-950/60 dark:text-pink-300 dark:hover:bg-pink-900/80 transition flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </a>

        <button @click="fetchSchedule()" :disabled="loading || !isOnline" :title="isOnline ? 'Sync Schedule' : 'Offline - Sync disabled'"
          :class="!isOnline ? 'opacity-50 cursor-not-allowed bg-gray-400' : 'bg-pink-600 hover:bg-pink-700'"
          class="p-2 rounded-lg text-white transition shadow-2xs flex items-center justify-center">
          <svg x-show="!loading" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.035 8.035 0 01-15.357-2m15.357 2H15" />
          </svg>
          <svg x-show="loading" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
        </button>

        <button @click="darkMode = !darkMode" title="Toggle Dark/Light Mode"
          class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-700 transition flex items-center justify-center">
          <span class="text-sm leading-none" x-text="darkMode ? '☀️' : '🌙'"></span>
        </button>
      </div>

    </div>
  </header>

  <main class="max-w-7xl mx-auto px-3 sm:px-4 py-3 sm:py-4">
    <!-- Enhanced Collapsible Filter Bar -->
    <section class="mb-4 sm:mb-6 bg-white dark:bg-[#1E1E1E] rounded-xl border border-gray-200 dark:border-gray-800 shadow-2xs overflow-hidden">
      
      <!-- Summary Header Bar -->
      <div @click="filtersOpen = !filtersOpen"
        class="w-full px-3.5 py-2.5 bg-gray-50/90 dark:bg-gray-800/60 flex items-center justify-between cursor-pointer select-none hover:bg-gray-100 dark:hover:bg-gray-800 transition">
        <div class="flex items-center gap-2 overflow-hidden">
          <svg class="w-4 h-4 text-pink-600 dark:text-pink-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
          </svg>
          <span class="font-bold text-xs text-gray-900 dark:text-white uppercase tracking-wider shrink-0">Filters</span>
          <span class="text-[10px] px-2 py-0.5 rounded-full bg-pink-100 text-pink-700 dark:bg-pink-950 dark:text-pink-300 font-semibold shrink-0"
            x-text="activeFilterCount > 0 ? activeFilterCount + ' Active' : 'Off'"></span>

          <!-- Quick Active Pills Display -->
          <div class="hidden sm:flex items-center gap-1 overflow-x-auto no-scrollbar py-0.5" @click.stop>
            <template x-if="selectedStyle !== 'All'">
              <span @click="selectedStyle = 'All'" class="text-[10px] px-2 py-0.5 rounded-full bg-pink-500/10 text-pink-600 dark:text-pink-400 font-medium flex items-center gap-1 cursor-pointer hover:bg-pink-500/20">
                <span x-text="selectedStyle"></span> &times;
              </span>
            </template>
            <template x-if="selectedFacilitator !== 'All'">
              <span @click="selectedFacilitator = 'All'" class="text-[10px] px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-600 dark:text-blue-400 font-medium flex items-center gap-1 cursor-pointer hover:bg-blue-500/20">
                <span x-text="selectedFacilitator"></span> &times;
              </span>
            </template>
            <template x-if="searchQuery.trim() !== ''">
              <span @click="searchQuery = ''" class="text-[10px] px-2 py-0.5 rounded-full bg-purple-500/10 text-purple-600 dark:text-purple-400 font-medium flex items-center gap-1 cursor-pointer hover:bg-purple-500/20">
                <span x-text="'&quot;' + searchQuery + '&quot;'"></span> &times;
              </span>
            </template>
          </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <button @click.stop="resetFilters()" x-show="activeFilterCount > 0"
            class="text-[11px] text-pink-600 dark:text-pink-400 hover:underline font-medium">
            Reset All
          </button>
          <span class="text-gray-400 text-xs transition-transform duration-200" :class="filtersOpen ? 'rotate-180' : ''">&#9660;</span>
        </div>
      </div>

      <!-- Collapsible Body -->
      <div x-show="filtersOpen" x-collapse x-cloak class="p-3.5 sm:p-4 space-y-4 border-t border-gray-200 dark:border-gray-800">
        
        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Festival Day</label>
          <div class="flex flex-wrap items-center gap-1 bg-gray-100 dark:bg-gray-800 p-1 rounded-lg text-xs font-medium">
            <template x-for="day in days" :key="day">
              <button @click="selectedDay = day"
                :class="selectedDay === day ? 'bg-white dark:bg-[#2A2A2A] text-gray-900 dark:text-white shadow-2xs font-bold' : 'text-gray-500 hover:text-gray-900 dark:hover:text-white'"
                class="px-3 py-1.5 rounded-md transition text-center flex-1 sm:flex-none" x-text="day"></button>
            </template>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Dance Style</label>
          <div class="flex flex-wrap items-center gap-1.5">
            <button @click="selectedStyle = 'All'"
              :class="selectedStyle === 'All' ? 'bg-gray-900 text-white dark:bg-white dark:text-gray-900 font-bold' : 'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400 hover:bg-gray-200'"
              class="px-3 py-1 text-xs rounded-full transition active:scale-95">All Styles</button>
            <template x-for="style in styles" :key="style">
              <button @click="selectedStyle = style"
                :class="selectedStyle === style ? 'ring-2 ring-pink-500 font-bold scale-105' : 'opacity-85 hover:opacity-100'"
                :style="`background-color: ${getStyleBadgeBg(style)}; color: ${getStyleBadgeText(style)}`"
                class="px-3 py-1 text-xs rounded-full transition active:scale-95" x-text="style"></button>
            </template>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-1">
          <div>
            <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Interest Level</label>
            <select x-model="selectedInterestFilter"
              class="w-full px-3 py-1.5 text-xs rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-pink-500">
              <option value="All">All Interest Levels</option>
              <option value="Unselected">Unselected Only</option>
              <template x-for="level in interestDefinitions" :key="level.id">
                <option :value="level.id" x-text="level.name"></option>
              </template>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Artist / Instructor</label>
            <select x-model="selectedFacilitator"
              class="w-full px-3 py-1.5 text-xs rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-pink-500">
              <option value="All">All Artists (A-Z)</option>
              <template x-for="fac in alphabeticalFacilitators" :key="fac">
                <option :value="fac" x-text="fac"></option>
              </template>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Search Workshop</label>
            <input type="text" x-model="searchQuery" placeholder="Search by name or artist..."
              class="w-full px-3 py-1.5 text-xs rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-gray-800 dark:text-gray-200 placeholder-gray-400 focus:ring-2 focus:ring-pink-500">
          </div>
        </div>

      </div>
    </section>

    <!-- Cards Grid -->
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5 sm:gap-4">
      <template x-for="item in filteredSchedule" :key="item.id">
        <div @click="openModal(item)"
          class="bg-white dark:bg-[#1E1E1E] rounded-xl border-2 p-3.5 sm:p-4 flex flex-col justify-between shadow-2xs hover:shadow-md transition-all duration-200 relative cursor-pointer"
          :style="getCardBorderStyle(item.id)">
          <div>
            <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400 mb-1.5">
              <span class="font-semibold text-gray-700 dark:text-gray-300" x-text="item.Time"></span>
              <span class="uppercase tracking-wider px-2 py-0.5 rounded text-[10px] font-medium truncate max-w-[120px]"
                :class="darkMode ? getLocationMeta(item.Location).class_text_dark : getLocationMeta(item.Location).class_text_light"
                :style="`background-color: ${getLocationMeta(item.Location).colour_hex || 'transparent'}`"
                x-text="getLocationMeta(item.Location).name"></span>
            </div>

            <h3 class="font-bold text-sm text-gray-900 dark:text-white mb-1 leading-snug" x-text="item.Name"></h3>
            <p class="text-xs text-gray-600 dark:text-gray-400 mb-3" x-text="item.Facilitator || '—'"></p>
          </div>

          <div class="pt-2.5 border-t border-gray-100 dark:border-gray-800/80 flex flex-col gap-2">

            <div class="flex items-center justify-between text-xs">
              <span class="px-2.5 py-0.5 rounded-full text-[11px] font-medium"
                :style="`background-color: ${getStyleBadgeBg(item.Style)}; color: ${getStyleBadgeText(item.Style)}`"
                x-text="item.Style"></span>

              <div
                class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] justify-center font-medium"
                :style="`background-color: ${getDifficultyMeta(item.Difficulty).color};
                  color: oklch(from ${getDifficultyMeta(item.Difficulty).color} calc(l - 0.35) c h);
                  `">
                <div class="flex items-center gap-0.5 py-0.5">
                  <template x-for="n in Number(getDifficultyMeta(item.Difficulty).multiplier)" :key="n">
                    <svg class="icon" width="14" height="14">
                      <use href="#icon-ghost"></use>
                    </svg>
                  </template>
                </div>
              </div>
            </div>

            <div class="pt-0.5 text-xs" @click.stop>
              <template x-if="!getItemUserData(item.id).interest">
                <div>
                  <label class="block text-[10px] text-gray-400 mb-1">Interest Level</label>
                  <select :value="getItemUserData(item.id).interest"
                    @change="updateUserInterest(item.id, $event.target.value)"
                    class="w-full text-xs rounded bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-1.5 text-gray-700 dark:text-gray-300 focus:ring-2 focus:ring-pink-500">
                    <option value="">Select Interest...</option>
                    <template x-for="level in interestDefinitions" :key="level.id">
                      <option :value="level.id" x-text="level.name"></option>
                    </template>
                  </select>
                </div>
              </template>

              <template x-if="getItemUserData(item.id).interest">
                <div class="flex items-center justify-between gap-2">
                  <span
                    class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold text-white shadow-2xs"
                    :style="`background-color: ${getInterestHex(getItemUserData(item.id).interest)}`">
                    <span x-text="getInterestName(getItemUserData(item.id).interest)"></span>
                  </span>

                  <button @click.stop="openModal(item)"
                    class="text-[11px] text-pink-600 dark:text-pink-400 hover:underline font-medium">
                    Edit &rarr;
                  </button>
                </div>
              </template>
            </div>

            <template x-if="getItemUserData(item.id).notes">
              <p class="text-[11px] text-gray-500 dark:text-gray-400 italic truncate pt-0.5"
                x-text="'💬 ' + getItemUserData(item.id).notes"></p>
            </template>

          </div>
        </div>
      </template>
    </section>

    <div x-show="filteredSchedule.length === 0" class="text-center py-12 text-gray-400 text-sm">
      No workshops match your current filters.
    </div>
  </main>

  <!-- Interactive Modal -->
  <div x-show="modalOpen" x-cloak
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs"
    x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
    <div @click.outside="closeModal()"
      class="bg-white dark:bg-[#1E1E1E] rounded-2xl max-w-md w-full p-5 sm:p-6 shadow-xl border border-gray-200 dark:border-gray-800 space-y-4 relative">
      <button @click="closeModal()"
        class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-white text-lg font-bold p-1">&times;</button>

      <template x-if="activeItem">
        <div>
          <div class="flex items-center justify-between gap-2 text-xs text-gray-500 dark:text-gray-400 mb-1">
            <span class="font-semibold" x-text="activeItem.Date + ' • ' + activeItem.Time"></span>
            <span class="uppercase font-medium px-2 py-0.5 rounded text-[10px]"
              :class="darkMode ? getLocationMeta(activeItem.Location).class_text_dark : getLocationMeta(activeItem.Location).class_text_light"
              :style="`background-color: ${getLocationMeta(activeItem.Location).colour_hex || 'transparent'}`"
              x-text="getLocationMeta(activeItem.Location).name"></span>
          </div>
          <h2 class="text-base sm:text-lg font-bold text-gray-900 dark:text-white" x-text="activeItem.Name"></h2>
          <p class="text-xs text-gray-500 dark:text-gray-400 mb-3"
            x-text="'Facilitator: ' + (activeItem.Facilitator || 'N/A')"></p>

          <div class="space-y-3.5 pt-2">
            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Interest Level</label>
              <select :value="getItemUserData(activeItem.id).interest"
                @change="updateUserInterest(activeItem.id, $event.target.value)"
                class="w-full text-xs rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 p-2 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-pink-500">
                <option value="">None (Unselected)</option>
                <template x-for="level in interestDefinitions" :key="level.id">
                  <option :value="level.id" x-text="level.name"></option>
                </template>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Experience Rating</label>
              <select :value="getItemUserData(activeItem.id).rating"
                @change="updateUserRating(activeItem.id, $event.target.value)"
                class="w-full text-xs rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 p-2 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-pink-500">
                <option value="">Unrated</option>
                <template x-for="exp in experienceDefinitions" :key="exp.id">
                  <option :value="exp.id" x-text="exp.name"></option>
                </template>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Personal Notes</label>
              <textarea :value="getItemUserData(activeItem.id).notes"
                @input.debounce.300ms="updateUserNotes(activeItem.id, $event.target.value)" rows="3"
                placeholder="Add takeaways, moves learned, or comments..."
                class="w-full text-xs rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 p-2 text-gray-800 dark:text-gray-200 placeholder-gray-400 focus:ring-2 focus:ring-pink-500"></textarea>
            </div>
          </div>

          <div class="pt-3 flex justify-end">
            <button @click="closeModal()"
              class="px-4 py-2 bg-pink-600 hover:bg-pink-700 text-white font-medium text-xs rounded-lg transition shadow-2xs">Save
              & Done</button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg failed:', err));
      });
    }

    function getInitialDarkMode() {
      const saved = localStorage.getItem('darkMode');
      if (saved !== null) {
        return saved === 'true';
      }
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    function appData() {
      return {
        darkMode: getInitialDarkMode(),
        isOnline: navigator.onLine,
        loading: false,
        filtersOpen: false,
        selectedDay: '13.11',
        selectedStyle: 'All',
        selectedFacilitator: 'All',
        selectedInterestFilter: 'All',
        searchQuery: '',
        modalOpen: false,
        activeItem: null,

        days: ['13.11', '14.11', '15.11'],
        styles: ['Salsa', 'Cuban', 'Bachata', 'Special'],

        interestDefinitions: [
          { id: '1', name: '1 - Skip', hex: '#6C757D' },
          { id: '2', name: '2 - Low', hex: '#6C757D' },
          { id: '3', name: '3 - Medium', hex: '#17A2B8' },
          { id: '4', name: '4 - High', hex: '#28A745' },
          { id: '5', name: '5 - Must Attend', hex: '#D63384' }
        ],

        experienceDefinitions: [
          { id: '1', name: '1 - Poor', hex: '#DC3545' },
          { id: '2', name: '2 - Fair', hex: '#FD7E14' },
          { id: '3', name: '3 - Good', hex: '#FFC107' },
          { id: '4', name: '4 - Great', hex: '#28A745' },
          { id: '5', name: '5 - Mindblowing', hex: '#0D6EFD' }
        ],

        difficultyDefinitions: {},
        locationDefinitions: {},

        schedule: [],
        userData: {},

        sheetKey: '1L7pRkX-guI1Ka30VcUjIYgE8pu8bhQFm4btvUi2athg',

        get activeFilterCount() {
          let count = 0;
          if (this.selectedStyle !== 'All') count++;
          if (this.selectedFacilitator !== 'All') count++;
          if (this.selectedInterestFilter !== 'All') count++;
          if (this.searchQuery.trim() !== '') count++;
          return count;
        },

        resetFilters() {
          this.selectedStyle = 'All';
          this.selectedFacilitator = 'All';
          this.selectedInterestFilter = 'All';
          this.searchQuery = '';
        },

        loadUserDataFromStorage() {
          try {
            const raw = localStorage.getItem('elSol_userData');
            this.userData = raw ? JSON.parse(raw) : {};
          } catch (e) {
            this.userData = {};
          }
        },

        getItemUserData(id) {
          const key = String(id);
          if (!this.userData[key]) {
            this.userData[key] = { interest: '', rating: '', notes: '' };
          }
          return this.userData[key];
        },

        saveUserData() {
          localStorage.setItem('elSol_userData', JSON.stringify(this.userData));
        },

        updateUserInterest(id, val) {
          const key = String(id);
          if (!this.userData[key]) {
            this.userData[key] = { interest: '', rating: '', notes: '' };
          }
          this.userData[key] = {
            ...this.userData[key],
            interest: String(val || '')
          };
          this.userData = { ...this.userData };
          this.saveUserData();
        },

        updateUserRating(id, val) {
          const key = String(id);
          if (!this.userData[key]) {
            this.userData[key] = { interest: '', rating: '', notes: '' };
          }
          this.userData[key] = {
            ...this.userData[key],
            rating: String(val || '')
          };
          this.userData = { ...this.userData };
          this.saveUserData();
        },

        updateUserNotes(id, val) {
          const key = String(id);
          if (!this.userData[key]) {
            this.userData[key] = { interest: '', rating: '', notes: '' };
          }
          this.userData[key] = {
            ...this.userData[key],
            notes: String(val || '')
          };
          this.userData = { ...this.userData };
          this.saveUserData();
        },

        async init() {
          window.addEventListener('online', () => this.isOnline = true);
          window.addEventListener('offline', () => this.isOnline = false);

          this.$watch('darkMode', val => {
            localStorage.setItem('darkMode', val);
          });

          this.loadUserDataFromStorage();

          const storedSched = localStorage.getItem('elSol_schedule');
          const storedDiff = localStorage.getItem('elSol_def_difficulty');
          const storedLoc = localStorage.getItem('elSol_def_location');
          const storedInterest = localStorage.getItem('elSol_def_interest_level');
          const storedExp = localStorage.getItem('elSol_def_experience_level');

          if (storedInterest) this.interestDefinitions = JSON.parse(storedInterest);
          if (storedExp) this.experienceDefinitions = JSON.parse(storedExp);
          if (storedDiff) this.difficultyDefinitions = JSON.parse(storedDiff);
          if (storedLoc) this.locationDefinitions = JSON.parse(storedLoc);

          if (storedSched) {
            this.schedule = JSON.parse(storedSched);
          }

          if (this.isOnline) {
            await this.fetchSchedule();
          }
        },

        fetchSchedule() {
          if (!this.isOnline) return Promise.resolve();
          this.loading = true;
          return Promise.all([
            this.fetchSheetData('def_difficulty'),
            this.fetchSheetData('def_location'),
            this.fetchSheetData('def_interest_level'),
            this.fetchSheetData('def_experience_level'),
            this.fetchSheetData('schedule')
          ]).then(([diffRows, locRows, interestRows, expRows, schedRows]) => {
            if (diffRows && diffRows.length > 0) {
              const diffMap = {};
              diffRows.forEach(r => {
                const id = String(r.Difficulty || r.id || r.name || r.display_name || '').trim();
                if (id) {
                  diffMap[id] = {
                    id: id,
                    name: String(r.display_name || r.name || id).trim(),
                    multiplier: parseInt(r.multiplier || r.multiplier_value || 0, 10) || 0,
                    color: String(r.colour_hex || r.color || r.hex || '#6C757D').trim()
                  };
                }
              });
              this.difficultyDefinitions = diffMap;
              localStorage.setItem('elSol_def_difficulty', JSON.stringify(diffMap));
            }

            if (locRows && locRows.length > 0) {
              const locMap = {};
              locRows.forEach(r => {
                const id = String(r.Location || r.location || r.id || r.name || r.display_name || r.A || '').trim();
                if (id) {
                  locMap[id] = {
                    id: id,
                    name: String(r.Location || r.display_name || r.name || r.A || r.id).trim(),
                    colour_hex: String(r.colour_hex || r.color || r.hex || '').trim(),
                    class_text_light: String(r.class_text_light || r.C || 'text-gray-700').trim(),
                    class_text_dark: String(r.class_text_dark || r.D || 'text-gray-300').trim()
                  };
                }
              });
              this.locationDefinitions = locMap;
              localStorage.setItem('elSol_def_location', JSON.stringify(locMap));
            }

            if (interestRows && interestRows.length > 0) {
              const interestList = interestRows.map(r => {
                const id = String(r.interest_level_id || r.id || r.level_id || r.A || '').trim();
                const name = String(r.name || r.display_name || r.B || id).trim();
                const hex = String(r.hex_color || r.colour_hex || r.hex || r.color || r.C || '#6C757D').trim();
                return { id, name, hex };
              }).filter(item => item.id);

              if (interestList.length > 0) {
                this.interestDefinitions = interestList;
                localStorage.setItem('elSol_def_interest_level', JSON.stringify(interestList));
              }
            }

            if (expRows && expRows.length > 0) {
              const expList = expRows.map(r => {
                const id = String(r.experience_level_id || r.id || r.level_id || r.A || '').trim();
                const name = String(r.name || r.display_name || r.B || id).trim();
                const hex = String(r.hex_color || r.colour_hex || r.hex || r.color || r.C || '#6C757D').trim();
                return { id, name, hex };
              }).filter(item => item.id);

              if (expList.length > 0) {
                this.experienceDefinitions = expList;
                localStorage.setItem('elSol_def_experience_level', JSON.stringify(expList));
              }
            }

            if (schedRows && schedRows.length > 0) {
              this.schedule = schedRows.map((row, idx) => ({
                id: String(row.id || (idx + 1)),
                Date: String(row.Date || '13.11').trim(),
                Time: String(row.Time || '').trim(),
                Style: String(row.Style || 'Salsa').trim(),
                Name: String(row.Name || row['page title'] || 'Workshop').trim(),
                Facilitator: String(row.Facilitator || '').trim(),
                Difficulty: String(row.Difficulty || 'Public').trim(),
                Location: String(row.Location || 'FOYER').trim()
              }));

              localStorage.setItem('elSol_schedule', JSON.stringify(this.schedule));
            }
          }).catch(err => {
            console.error('Error fetching sheet data:', err);
          }).finally(() => {
            this.loading = false;
          });
        },

        fetchSheetData(sheetName) {
          return new Promise((resolve) => {
            const callbackName = `gviz_cb_${sheetName}_${Date.now()}`;
            window[callbackName] = (response) => {
              try {
                if (response && response.table && response.table.rows) {
                  const cols = response.table.cols.map(c => c.label || c.id);
                  const extractVal = (cell) => {
                    if (!cell) return '';
                    if (cell.f !== undefined && cell.f !== null) return String(cell.f).trim();
                    if (cell.v !== undefined && cell.v !== null) {
                      if (Array.isArray(cell.v)) {
                        const h = String(cell.v[0] || 0).padStart(2, '0');
                        const m = String(cell.v[1] || 0).padStart(2, '0');
                        const s = String(cell.v[2] || 0).padStart(2, '0');
                        return `${h}:${m}:${s}`;
                      }
                      return String(cell.v).trim();
                    }
                    return '';
                  };
                  const parsedRows = response.table.rows.map(r => {
                    const rowObj = {};
                    r.c.forEach((cell, i) => {
                      const colName = cols[i] || `col_${i}`;
                      rowObj[colName] = extractVal(cell);
                    });
                    return rowObj;
                  });
                  resolve(parsedRows);
                } else {
                  resolve([]);
                }
              } catch (e) {
                console.error(`Error parsing ${sheetName}:`, e);
                resolve([]);
              } finally {
                delete window[callbackName];
                const scriptElem = document.getElementById(`script_${sheetName}`);
                if (scriptElem) scriptElem.remove();
              }
            };

            const url = `https://docs.google.com/spreadsheets/d/${this.sheetKey}/gviz/tq?tqx=responseHandler:${callbackName}&sheet=${sheetName}`;
            const script = document.createElement('script');
            script.id = `script_${sheetName}`;
            script.src = url;
            script.onerror = () => {
              console.error(`Failed to fetch ${sheetName} script.`);
              resolve([]);
            };
            document.body.appendChild(script);
          });
        },

        getDifficultyMeta(diffRaw) {
          if (!diffRaw) return { name: 'Public', multiplier: 0, color: '#edf1f5' };
          const rawKey = String(diffRaw).trim();
          if (this.difficultyDefinitions[rawKey]) return this.difficultyDefinitions[rawKey];

          const lowerKey = rawKey.toLowerCase();
          for (const key in this.difficultyDefinitions) {
            const item = this.difficultyDefinitions[key];
            if (key.toLowerCase() === lowerKey || item.name.toLowerCase() === lowerKey) {
              return item;
            }
          }
          return { name: rawKey, multiplier: 0, color: '#edf1f5' };
        },

        getLocationMeta(locRaw) {
          if (!locRaw) return { name: 'FOYER', colour_hex: '', class_text_light: 'text-gray-700 bg-gray-100', class_text_dark: 'text-gray-300 bg-gray-800' };
          const rawKey = String(locRaw).trim();
          if (this.locationDefinitions[rawKey]) return this.locationDefinitions[rawKey];

          const lowerKey = rawKey.toLowerCase();
          for (const key in this.locationDefinitions) {
            const item = this.locationDefinitions[key];
            if (key.toLowerCase() === lowerKey || item.name.toLowerCase() === lowerKey) {
              return item;
            }
          }
          return { name: rawKey, colour_hex: '', class_text_light: 'text-gray-700 bg-gray-100', class_text_dark: 'text-gray-300 bg-gray-800' };
        },

        openModal(item) {
          this.activeItem = item;
          this.getItemUserData(item.id);
          this.modalOpen = true;
        },

        closeModal() {
          this.modalOpen = false;
          this.activeItem = null;
        },

        get alphabeticalFacilitators() {
          const names = new Set();
          this.schedule.forEach(s => {
            if (s.Facilitator && s.Facilitator.trim() !== '') {
              names.add(s.Facilitator.trim());
            }
          });
          return Array.from(names).sort((a, b) => a.localeCompare(b));
        },

        get filteredSchedule() {
          return this.schedule.filter(item => {
            const matchesDay = !this.selectedDay || item.Date === this.selectedDay;
            const matchesStyle = this.selectedStyle === 'All' || item.Style === this.selectedStyle;
            const matchesFacilitator = this.selectedFacilitator === 'All' || item.Facilitator === this.selectedFacilitator;

            const userInterest = this.getItemUserData(item.id).interest;
            let matchesInterest = true;

            if (this.selectedInterestFilter === 'Unselected') {
              matchesInterest = !userInterest;
            } else if (this.selectedInterestFilter !== 'All') {
              matchesInterest = userInterest === String(this.selectedInterestFilter);
            }

            const matchesQuery = !this.searchQuery ||
              item.Name.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
              (item.Facilitator && item.Facilitator.toLowerCase().includes(this.searchQuery.toLowerCase()));

            return matchesDay && matchesStyle && matchesFacilitator && matchesInterest && matchesQuery;
          });
        },

        getInterestHex(interestId) {
          const match = this.interestDefinitions.find(i => String(i.id) === String(interestId));
          return match ? match.hex : '#6C757D';
        },

        getInterestName(interestId) {
          const match = this.interestDefinitions.find(i => String(i.id) === String(interestId));
          return match ? match.name : 'Selected';
        },

        getCardBorderStyle(itemId) {
          const userRec = this.getItemUserData(itemId);
          if (userRec && userRec.interest) {
            const hex = this.getInterestHex(userRec.interest);
            return `border-color: ${hex};`;
          }
          return 'border-color: transparent;';
        },

        getStyleBadgeBg(style) {
          switch (style) {
            case 'Bachata': return '#FCE7F3';
            case 'Salsa': return '#FFEDD5';
            case 'Cuban': return '#DBEAFE';
            default: return '#F3F4F6';
          }
        },

        getStyleBadgeText(style) {
          switch (style) {
            case 'Bachata': return '#9D174D';
            case 'Salsa': return '#C2410C';
            case 'Cuban': return '#1E40AF';
            default: return '#374151';
          }
        }
      }
    }
  </script>
